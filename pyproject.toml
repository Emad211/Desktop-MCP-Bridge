[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "desktop-mcp-bridge"
version = "1.2.0"
description = "A local-first, auditable Windows control bridge for MCP clients and private GPT Actions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emad211" }]
dependencies = [
  "mcp>=1.27,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "platformdirs>=4.2,<5",
  "mss>=9,<11",
  "Pillow>=10.4,<12",
  "pyautogui>=0.9.54,<1",
  "pygetwindow>=0.0.9,<1; sys_platform == 'win32'",
  "pyperclip>=1.9,<2",
  "pywinauto>=0.6.9,<1; sys_platform == 'win32'",
  "psutil>=6,<8",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "playwright>=1.56,<2",
  "pytesseract>=0.3.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.scripts]
desktop-mcp-bridge = "desktop_mcp_bridge.__main__:main"
desktop-action-gateway = "desktop_mcp_bridge.action_api:run_action_api"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_mcp_bridge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/probe_superassistant_sse.py" = ["I001", "SIM117"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
