name: SuperAssistant Contract

on:
  push:
    branches: ["feat/chat-superassistant-universal-runtime"]
  pull_request:
    paths:
      - "src/desktop_mcp_bridge/**"
      - "scripts/*superassistant*.ps1"
      - "scripts/*chatgpt*.ps1"
      - "scripts/probe_mcp_stdio.py"
      - "tests/test_superassistant_compat.py"
      - ".github/workflows/superassistant-contract.yml"

permissions:
  contents: read

jobs:
  stdio-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run compatibility unit test
        run: python -m pytest tests/test_superassistant_compat.py
      - name: Validate VPN-aware network plan
        shell: pwsh
        run: |
          $Raw = .\scripts\get-superassistant-network-plan.ps1 `
            -NetworkMode auto `
            -TimeoutSeconds 15
          $Plan = $Raw | ConvertFrom-Json
          if ($Plan.ok -ne $true) { throw "CI network plan found no npm route." }
          if ($Plan.resolved_mode -notin @("direct", "proxy")) { throw "Unexpected network mode." }
          if ($Plan.local_bypass -notmatch "localhost") { throw "localhost is not bypassed." }
          if ($Plan.local_bypass -notmatch "127\.0\.0\.1") { throw "127.0.0.1 is not bypassed." }
          $Plan | ConvertTo-Json -Depth 20
      - name: Build CI SuperAssistant config
        shell: pwsh
        run: |
          $Root = ((Get-Location).Path -replace '\\', '/')
          $Python = (Get-Command python).Source
          $Environment = [ordered]@{
            DMB_TRANSPORT = "stdio"
            DMB_ACCESS_PROFILE = "safe"
            DMB_ALLOWED_ROOTS = (ConvertTo-Json -InputObject @($Root) -Compress)
            DMB_ENABLE_BROWSER = "false"
            DMB_ENABLE_OCR = "false"
          }
          $Config = [ordered]@{
            mcpServers = [ordered]@{
              "desktop-mcp-bridge" = [ordered]@{
                command = $Python
                args = @("-m", "desktop_mcp_bridge.superassistant_server")
                env = $Environment
              }
            }
          }
          $Config | ConvertTo-Json -Depth 20 | Set-Content superassistant-ci.json -Encoding UTF8
          Get-Content superassistant-ci.json -Raw | ConvertFrom-Json | Out-Null
      - name: Probe MCP stdio initialize, tools, and status
        shell: pwsh
        run: |
          python scripts/probe_mcp_stdio.py `
            --config superassistant-ci.json `
            --server desktop-mcp-bridge `
            --timeout 45
