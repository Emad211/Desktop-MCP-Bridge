name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: python -m ruff check .
      - run: python -m pytest --cov=desktop_mcp_bridge --cov-report=term-missing
      - name: Validate Action OpenAPI generation
        shell: pwsh
        run: |
          python -c "from desktop_mcp_bridge.action_api import app; s=app.openapi(); assert s['openapi'].startswith('3.'); assert '/v1/act' in s['paths']; print(s['openapi'])"
